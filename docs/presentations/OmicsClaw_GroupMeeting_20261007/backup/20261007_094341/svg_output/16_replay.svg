<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F8FAFC"/><g id="heading" data-pptx-bounds="60 42 1160 110" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">执行状态 / 显式依赖与干净重放</text><text x="60" y="123" font-size="40" font-weight="bold">run、status、replay 分别回答不同问题</text></g>
<g id="stale" data-pptx-bounds="60 186 1160 118" fill="#20364B"><rect x="60" y="190" width="1160" height="103" fill="#E9F1F5"/><text x="86" y="234" font-size="30">上游文件变化 → 输入哈希变化 → 下游步骤 stale</text><text x="86" y="275" font-size="20" fill="#526779">步骤代码变化也会触发过期；判断依据保存在 manifest 与运行台账。</text></g>
<g id="commands" data-pptx-bounds="60 340 1160 207" fill="#20364B"><text x="62" y="382" font-size="40" fill="#17324D" font-weight="bold">status</text><text x="62" y="438">哪里过期，为什么？</text><text x="62" y="483" font-size="20" fill="#526779">只观察，不执行分析</text><text x="475" y="382" font-size="40" fill="#17324D" font-weight="bold">run</text><text x="475" y="438">执行当前过期步骤</text><text x="475" y="483" font-size="20" fill="#526779">适合迭代修改</text><text x="870" y="382" font-size="40" fill="#007F7A" font-weight="bold">replay</text><text x="870" y="438">全部步骤重新执行</text><text x="870" y="483" font-size="20" fill="#526779">Python validate 最后运行</text></g>
<g id="scope" data-pptx-bounds="60 565 1160 78" fill="#AE641B"><text x="60" y="596">显式 IO 才进入台账；文件回放成功仍需检查统计假设。</text><text x="60" y="635" font-size="20" fill="#526779">read_input / write_output 为依赖追踪提供证据，不是任意脚本的全量审计。</text></g>
