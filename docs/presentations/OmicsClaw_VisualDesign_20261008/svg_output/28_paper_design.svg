<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F8FAFC"/><g id="heading" data-pptx-bounds="60 42 1160 116" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">论文设计 / 评测什么</text><text x="60" y="123" font-size="40" font-weight="bold">GeneBench-Pro：把连续判断变成可检验任务</text></g><g id="setup" data-pptx-bounds="60 205 1160 100" fill="#20364B"><text x="60" y="243" font-size="30">129 个任务</text><text x="60" y="289" font-size="20">10 个领域 · 21 个子领域</text><text x="470" y="243" font-size="30">简短背景 + 目标量</text><text x="470" y="289" font-size="20">提供数据，不预设分析流程</text><text x="920" y="243" font-size="30">多步判断</text><text x="920" y="289" font-size="20">上游选择影响最终答案</text></g><g id="branch" data-pptx-bounds="60 360 1160 168" fill="#17324D"><rect x="60" y="382" width="250" height="92" fill="#E9F1F5"/><text x="95" y="438">诊断与方法选择</text><path d="M310 428 H470 V384 H640 L628 375 M640 384 L628 393 M470 428 V491 H640 L628 482 M640 491 L628 500" fill="none" stroke="#007F7A" stroke-width="3"/><text x="680" y="395">合理分析 → 可恢复的目标量</text><text x="680" y="502" fill="#AE641B">错误选择 → 偏离目标答案</text></g><g id="takeaway" data-pptx-bounds="60 579 1160 58"><text x="60" y="617" fill="#17324D">受控模拟让答案可判定，也让错误路径能被单独检验。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="60 674 1160 26" fill="#526779" font-size="14"><text x="60" y="691">GeneBench-Pro · Benchmark Setup / Table 1；示意图为概括，非实验结果</text><text x="1174" y="691">28</text></g></svg>
