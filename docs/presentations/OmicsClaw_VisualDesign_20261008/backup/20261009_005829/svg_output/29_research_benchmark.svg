<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F8FAFC"/><g id="heading" data-pptx-bounds="60 42 1160 110" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">下一阶段 3 / 独立组学 Benchmark</text><text x="60" y="123" font-size="40" font-weight="bold">改变实验设计，Agent 会改变决策吗？</text></g><g id="shared-question" data-pptx-bounds="60 180 1160 90"><rect x="60" y="180" width="1160" height="86" fill="#17324D"/><text x="90" y="235" fill="#FFFFFF" font-size="30">同一研究问题：比较疾病组与对照组的表达差异</text></g><g id="pair-a" data-pptx-bounds="60 303 550 216" fill="#20364B"><text x="60" y="339" font-size="30" font-weight="bold">A：目标可估计</text><text x="60" y="391">独立 donor，条件与批次可分离</text><path d="M300 413 V445 L289 434 M300 445 L311 434" stroke="#007F7A" stroke-width="3" fill="none"/><rect x="60" y="461" width="550" height="58" fill="#D9EEEA"/><text x="90" y="500">给出效应与不确定性</text></g><g id="pair-b" data-pptx-bounds="670 303 550 216" fill="#20364B"><text x="670" y="339" font-size="30" font-weight="bold">B：条件与批次完全混杂</text><text x="670" y="391">疾病全在批次 1，对照全在批次 2</text><path d="M920 413 V445 L909 434 M920 445 L931 434" stroke="#007F7A" stroke-width="3" fill="none"/><rect x="670" y="461" width="550" height="58" fill="#E9F1F5"/><text x="700" y="500">停止该效应推断，说明缺少的设计</text></g><g id="metrics" data-pptx-bounds="60 576 1160 84" fill="#17324D"><text x="60" y="610">科学成功率 · 无依据结论率 · 错误拒绝率</text><text x="60" y="648" font-size="20" fill="#526779">独立评分；OmicsClaw 与其他 Agent 在相同条件下比较。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="60 674 1160 26" fill="#526779" font-size="14"><text x="60" y="691">成对任务设计示意 · 尚未形成评测结果</text><text x="1174" y="691">29</text></g></svg>
