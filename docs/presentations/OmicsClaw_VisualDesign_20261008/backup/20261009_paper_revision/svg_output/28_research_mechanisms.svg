<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F8FAFC"/><g id="heading" data-pptx-bounds="60 42 1160 110" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">下一阶段 2 / 候选机制</text><text x="60" y="123" font-size="40" font-weight="bold">沿着一次分析，研究三类决策机制</text></g><g id="stages" data-pptx-bounds="60 200 1160 78" fill="#007F7A"><text x="60" y="238" font-size="30">分析前</text><text x="470" y="238" font-size="30">分析中</text><text x="880" y="238" font-size="30">形成结论时</text><path d="M210 225 H420 L407 214 M420 225 L407 236 M620 225 H830 L817 214 M830 225 L817 236" stroke="#007F7A" stroke-width="2" fill="none"/></g><g id="preflight" data-pptx-bounds="60 307 340 220" fill="#20364B"><text x="60" y="347" font-size="30" font-weight="bold">可回答性检查</text><text x="60" y="393" font-size="20" fill="#007F7A">EstimandGuard</text><text x="60" y="458">数据支持目标推断吗？</text><text x="60" y="510" font-size="20">核对实验单位、混杂与重复</text></g><g id="recovery" data-pptx-bounds="470 307 340 220" fill="#20364B"><text x="470" y="347" font-size="30" font-weight="bold">科学错误恢复</text><text x="470" y="393" font-size="20" fill="#007F7A">识别 → 修正 / 补充 / 停止</text><text x="470" y="458">代码成功，推断有效吗？</text><text x="470" y="510" font-size="20">检查并验证后续处理</text></g><g id="robustness" data-pptx-bounds="880 307 340 220" fill="#20364B"><text x="880" y="347" font-size="30" font-weight="bold">结论稳定性</text><text x="880" y="393" font-size="20" fill="#007F7A">预算内主动选择分析分支</text><text x="880" y="458">换条合理路径还成立吗？</text><text x="880" y="510" font-size="20">比较目标一致的有效分析</text></g><g id="takeaway" data-pptx-bounds="60 588 1160 54"><text x="60" y="625" fill="#17324D">用独立实验检验每项机制，再验证它们的组合收益。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="60 674 1160 26" fill="#526779" font-size="14"><text x="60" y="691">候选研究机制，尚待实现与验证</text><text x="1174" y="691">28</text></g></svg>
