<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="ending"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#17324D"/><g id="heading" data-pptx-bounds="60 42 1160 110" fill="#FFFFFF"><text x="60" y="66" font-size="20" fill="#C9D7E2">研究方案 / 首期计划</text><text x="60" y="123" font-size="40" font-weight="bold">先证明任务有效，再验证方法增益</text></g><g id="scope" data-pptx-bounds="60 190 1160 123" fill="#FFFFFF"><text x="60" y="272" font-size="88" font-weight="bold">20–30</text><text x="377" y="265" font-size="30">题 Pilot</text><text x="700" y="264" font-size="30" fill="#D9EEEA">单细胞 + Bulk RNA-seq</text></g><g id="roadmap" data-pptx-bounds="60 354 1160 167" fill="#FFFFFF"><text x="60" y="395" font-size="30" font-weight="bold">1　校准任务</text><text x="60" y="458">正确路径、错误路径<tspan x="60" dy="40">与合理替代方法</tspan></text><text x="470" y="395" font-size="30" font-weight="bold">2　冻结评测</text><text x="470" y="458">独立评分与隐藏测试<tspan x="470" dy="40">统一模型、工具与预算</tspan></text><text x="880" y="395" font-size="30" font-weight="bold">3　消融验证</text><text x="880" y="458">基线 → 单项机制<tspan x="880" dy="40">→ 组合机制</tspan></text></g><g id="success" data-pptx-bounds="60 560 1160 77" fill="#D9EEEA"><line x1="60" y1="560" x2="1220" y2="560" stroke="#007F7A" stroke-width="3"/><text x="60" y="612" font-size="30">目标：减少无依据结论，同时保持有效任务的完成能力。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="60 674 1160 26" fill="#C9D7E2" font-size="14"><text x="60" y="691">拟定研究计划 · 校准通过后再扩展规模</text><text x="1174" y="691">33</text></g></svg>
