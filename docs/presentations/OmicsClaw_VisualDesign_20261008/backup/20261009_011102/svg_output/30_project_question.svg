<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F8FAFC"/><g id="heading" data-pptx-bounds="60 42 1160 116" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">对 OmicsClaw 的启发 / 拟研究问题</text><text x="60" y="123" font-size="40" font-weight="bold">让诊断证据进入后续决策</text></g><g id="mapping" data-pptx-bounds="60 198 1160 250" fill="#20364B"><text x="60" y="230" font-size="20" fill="#526779">已有基础</text><text x="590" y="230" font-size="20" fill="#007F7A">拟研究扩展</text><text x="60" y="285">技能与分析步骤</text><text x="590" y="285">记录目标量、假设与诊断证据</text><text x="60" y="355">执行计划与工具循环</text><text x="590" y="355">证据触发修正、补充信息或停止</text><text x="60" y="425">回放、审查与评测记录</text><text x="590" y="425">验证决策改变是否减少错误结论</text><path d="M390 274 H535 L524 265 M535 274 L524 283 M390 344 H535 L524 335 M535 344 L524 353 M390 414 H535 L524 405 M535 414 L524 423" stroke="#007F7A" stroke-width="2" fill="none"/></g><g id="question" data-pptx-bounds="60 504 1160 128" fill="#17324D"><rect x="60" y="504" width="1160" height="128" fill="#D9EEEA"/><text x="85" y="550" font-size="30">同一模型与预算下，加入证据驱动的决策检查，<tspan x="85" dy="48">能否减少无依据结论，同时保留有效任务的完成能力？</tspan></text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="60 674 1160 26" fill="#526779" font-size="14"><text x="60" y="691">由论文问题推导的项目假设；右列尚待实现与验证，不代表已有收益</text><text x="1174" y="691">30</text></g></svg>
