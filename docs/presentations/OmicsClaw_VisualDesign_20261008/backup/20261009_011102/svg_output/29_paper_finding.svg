<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F8FAFC"/><g id="heading" data-pptx-bounds="60 42 1160 116" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">论文发现 / Notice–act gap</text><text x="60" y="123" font-size="40" font-weight="bold">发现异常之后，分析决策是否随之改变？</text></g><g id="gap" data-pptx-bounds="60 216 1160 190" fill="#17324D"><text x="60" y="259" font-size="30">发现诊断线索</text><text x="60" y="322" font-size="20">数据异常 · 统计假设受挑战</text><path d="M390 269 H515 M680 269 H800 L787 259 M800 269 L787 279" stroke="#007F7A" stroke-width="3" fill="none"/><text x="540" y="280" font-size="30" fill="#AE641B">断点</text><text x="860" y="259" font-size="30">调整后续分析</text><text x="860" y="322" font-size="20">改模型 · 改目标 · 改路径</text><text x="60" y="394" fill="#AE641B">部分失败轨迹中，异常被注意到，却未改变关键选择。</text></g><g id="boundary" data-pptx-bounds="60 465 1160 155" fill="#20364B"><line x1="60" y1="465" x2="1220" y2="465" stroke="#C9D7E2" stroke-width="2"/><text x="60" y="510" font-size="20" fill="#526779">结论边界</text><text x="60" y="560">轨迹分析提供线索；尚未证明某种控制机制有效。</text><text x="60" y="607" font-size="20">模拟任务的真实性有边界；终点二元评分压缩了中间过程信息。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="60 674 1160 26" fill="#526779" font-size="14"><text x="60" y="691">GeneBench-Pro · Results / Discussion；机制效果需在 OmicsClaw 中另做实验</text><text x="1174" y="691">29</text></g></svg>
