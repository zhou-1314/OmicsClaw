<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" width="1280" height="720" fill="#F8FAFC" data-pptx-role="background"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#007F7A"/></marker></defs><g id="heading" data-pptx-bounds="60 42 1160 110" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">失败恢复 / 错误类型决定下一步动作</text><text x="60" y="123" font-size="40" font-weight="bold">让错误进入判断，而不是重复同一动作</text></g>
<g id="repair-loop" data-pptx-bounds="60 190 1160 223" fill="#20364B"><rect x="60" y="209" width="260" height="85" fill="#E9F1F5"/><text x="98" y="261">工具返回错误</text><path d="M320 251 H403" stroke="#007F7A" stroke-width="3" marker-end="url(#a)"/><rect x="415" y="209" width="350" height="85" fill="#17324D"/><text x="449" y="261" fill="#FFFFFF">模型读取错误与结果</text><path d="M765 251 H858" stroke="#007F7A" stroke-width="3" marker-end="url(#a)"/><rect x="870" y="209" width="350" height="85" fill="#D9EEEA"/><text x="905" y="261">修改输入 / 参数 / 代码</text><path d="M1045 294 V369 H190 V304" fill="none" stroke="#007F7A" stroke-width="3" marker-end="url(#a)"/><text x="505" y="405" font-size="20" fill="#007F7A">再执行，读取新的观察</text></g><g id="limits" data-pptx-bounds="60 460 1160 106" fill="#20364B"><rect x="60" y="460" width="545" height="105" fill="#E9F1F5"/><text x="90" y="499" font-size="30">暂时性模型服务故障</text><text x="90" y="543">有限重试 + 退避</text><rect x="675" y="460" width="545" height="105" fill="#D9EEEA"/><text x="705" y="499" font-size="30">超出预算 / 用户取消</text><text x="705" y="543">停止执行</text></g><g id="takeaway" data-pptx-bounds="60 607 1160 45"><text x="60" y="641" fill="#17324D">恢复要有边界；已经完成的文件操作不会自动回滚。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="60 674 1160 26" fill="#526779" font-size="14"><text x="60" y="691">图式参考 Tony Bai；OmicsClaw 使用工具反馈与分层重试</text><text x="1174" y="691">14</text></g></svg>
