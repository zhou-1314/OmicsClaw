<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" width="1280" height="720" fill="#F8FAFC" data-pptx-role="background"/><g id="heading" data-pptx-bounds="60 42 1160 110" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">工具执行 / 把模型选择变成真实动作</text><text x="60" y="123" font-size="40" font-weight="bold">ToolRegistry：注册、描述、执行集中在一处</text></g>
<g id="path" data-pptx-bounds="60 184 1160 301" fill="#20364B"><rect x="60" y="208" width="317" height="212" fill="#E9F1F5"/><text x="83" y="255" font-size="30" font-weight="bold">1 注册实现</text><text x="83" y="305">register(tool)</text><text x="83" y="365" font-size="20">一个对象同时持有<tspan x="83" dy="30">定义、策略和执行方法</tspan></text><text x="396" y="315" font-size="30">→</text><rect x="457" y="208" width="341" height="212" fill="#17324D"/><text x="480" y="255" font-size="30" fill="#FFFFFF" font-weight="bold">2 暴露定义</text><text x="480" y="305" font-size="20" fill="#FFFFFF">available_tools()</text><text x="480" y="365" font-size="20" fill="#FFFFFF">名称、描述、参数 Schema<tspan x="480" dy="30">交给 provider，再传给模型</tspan></text><text x="818" y="315" font-size="30">→</text><rect x="879" y="208" width="341" height="212" fill="#D9EEEA"/><text x="902" y="255" font-size="30" font-weight="bold">3 路由执行</text><text x="902" y="305">execute(call)</text><text x="902" y="365" font-size="20">按名称找到实现<tspan x="902" dy="30">返回 ToolResult</tspan></text><text x="60" y="469" font-size="20" fill="#526779">模型选择工具，registry 查找实现，engine 接收观察；主循环不认识具体科学方法。</text></g>
<g id="boundary" data-pptx-bounds="60 523 1160 132" fill="#20364B"><text x="60" y="565" font-size="30">模型可见的定义，与本机执行策略分开。</text><text x="60" y="609" font-size="20">风险、审批和并发声明保留在工具层；部署决定哪些工具可见。</text><text x="60" y="641" font-size="20" fill="#526779">read_file / write_file / edit_file / bash 承担读取、修改与执行。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="60 674 1160 26" fill="#526779" font-size="14"><text x="60" y="691">OmicsClaw · 核心组件与设计思想</text><text x="1174" y="691">07</text></g></svg>