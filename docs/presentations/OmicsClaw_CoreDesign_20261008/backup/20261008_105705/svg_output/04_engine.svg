<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#007F7A"/></marker></defs><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F8FAFC"/><g id="heading" data-pptx-bounds="60 42 1160 110" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">持续行动 / 每一步都根据结果再决定</text><text x="60" y="123" font-size="40" font-weight="bold">engine：一个内核维持 ReAct 循环</text></g>
<g id="loop" data-pptx-bounds="60 184 695 431" fill="#20364B"><rect x="70" y="200" width="257" height="97" fill="#E9F1F5"/><text x="106" y="258" font-size="30">Message</text><rect x="468" y="200" width="262" height="97" fill="#17324D"/><text x="503" y="258" font-size="30" fill="#FFFFFF">模型判断</text><rect x="468" y="449" width="262" height="97" fill="#D9EEEA"/><text x="502" y="507" font-size="30">ToolCall</text><rect x="70" y="449" width="257" height="97" fill="#D9EEEA"/><text x="99" y="507" font-size="30">ToolResult</text><line x1="330" y1="248" x2="449" y2="248" stroke="#007F7A" stroke-width="3" marker-end="url(#arrow)"/><line x1="598" y1="305" x2="598" y2="427" stroke="#007F7A" stroke-width="3" marker-end="url(#arrow)"/><line x1="463" y1="497" x2="347" y2="497" stroke="#007F7A" stroke-width="3" marker-end="url(#arrow)"/><line x1="198" y1="442" x2="198" y2="318" stroke="#007F7A" stroke-width="3" marker-end="url(#arrow)"/><text x="237" y="379" font-size="20" fill="#526779">观察进入下一轮</text><text x="72" y="604" font-size="20" fill="#526779">模型不再请求工具时，返回最终回答。</text></g>
<g id="contract" data-pptx-bounds="808 186 412 433" fill="#20364B"><text x="814" y="231" font-size="30" font-weight="bold">一个内核，两种输出</text><text x="814" y="292">run：返回完整结果<tspan x="814" dy="43">run_stream：逐步给事件</tspan></text><text x="814" y="411" font-size="20" fill="#526779">预算与终止由循环管理；<tspan x="814" dy="32">失败抛出，取消继续传播。</tspan><tspan x="814" dy="48">提示构造、会话存储和具体工具</tspan><tspan x="814" dy="32">分别交给外部组件。</tspan></text></g>
