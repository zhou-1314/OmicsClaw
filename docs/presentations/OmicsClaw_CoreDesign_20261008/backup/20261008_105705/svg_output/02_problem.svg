<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F8FAFC"/>
<g id="heading" data-pptx-bounds="60 42 1160 105" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">背景 / 分析任务为什么需要持续管理</text><text x="60" y="123" font-size="40" font-weight="bold">分析助手为什么需要运行时支撑</text></g>
<g id="methods" data-pptx-bounds="60 180 545 343" fill="#20364B"><rect x="60" y="182" width="545" height="335" fill="#E9F1F5"/><text x="88" y="231" font-size="30" font-weight="bold">方法与环境</text><text x="88" y="296">同一问题有多种分析方法<tspan x="88" dy="44">Python、R 与外部 CLI 混用</tspan><tspan x="88" dy="44">依赖、数据库和输入契约不同</tspan></text><text x="88" y="469" font-size="20" fill="#526779">需要：可发现的方法与可执行的环境</text></g>
<g id="evidence" data-pptx-bounds="645 180 575 343" fill="#20364B"><rect x="645" y="182" width="575" height="335" fill="#D9EEEA"/><text x="675" y="231" font-size="30" font-weight="bold">过程与证据</text><text x="675" y="296">参数改动后，下游是否过期？<tspan x="675" dy="44">结果能否脱离原会话再运行？</tspan><tspan x="675" dy="44">报告里的结论对应哪份输出？</tspan></text><text x="675" y="469" font-size="20" fill="#526779">需要：显式步骤、回放与审查</text></g>
<g id="thesis" data-pptx-bounds="60 552 1160 91" fill="#17324D"><text x="60" y="594" font-size="30">设计目标：把方法执行接到可检查的分析过程上</text><text x="60" y="633" font-size="20" fill="#526779">目标：方法找得到、过程接得上、结果查得清。</text></g>
