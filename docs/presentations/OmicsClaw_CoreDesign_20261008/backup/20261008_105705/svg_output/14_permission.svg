<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F8FAFC"/><g id="heading" data-pptx-bounds="60 42 1160 110" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">权限控制 / 高风险动作需要明确授权</text><text x="60" y="123" font-size="40" font-weight="bold">permission：策略决定，入口负责询问</text></g>
<g id="decision" data-pptx-bounds="60 179 1160 249" fill="#20364B"><text x="63" y="246" font-size="30">工具调用</text><text x="218" y="246" font-size="30" fill="#007F7A">→</text><rect x="285" y="190" width="521" height="172" fill="#17324D"/><text x="318" y="239" fill="#FFFFFF" font-size="30">PermissionGate</text><text x="318" y="298" fill="#FFFFFF">模式 + 规则 + 危险命令模式</text><text x="318" y="338" font-size="20" fill="#FFFFFF">决定 allow / ask / deny</text><text x="835" y="246" font-size="30" fill="#007F7A">→</text><text x="905" y="227" font-size="30">执行 / 拒绝</text><text x="905" y="292">需要时发起审批</text><text x="905" y="339" font-size="20" fill="#526779">入口显示卡片并收回决定</text><text x="60" y="415" font-size="20" fill="#526779">一次允许 / 会话允许 / 记住匹配规则，分别对应不同的授权范围。</text></g>
<g id="modes" data-pptx-bounds="60 471 557 164" fill="#20364B"><text x="60" y="507" font-size="30" font-weight="bold">运行姿态</text><text x="60" y="558">default / read-only / auto-approve</text><text x="60" y="605" font-size="20" fill="#526779">read-only 不允许 task 委派不受限的子任务。</text></g>
<g id="limits" data-pptx-bounds="662 471 558 164" fill="#20364B"><text x="662" y="507" font-size="30" font-weight="bold">仍保留的边界</text><text x="662" y="558">危险调用与保护路径仍可要求审批</text><text x="662" y="605" font-size="20" fill="#AE641B">命令模式匹配不能穷尽所有绕过方式。</text></g>
