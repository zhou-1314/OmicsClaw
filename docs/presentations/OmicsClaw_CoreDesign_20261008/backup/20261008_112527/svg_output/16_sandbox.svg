<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F8FAFC"/><g id="heading" data-pptx-bounds="60 42 1160 110" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">执行隔离 / 限定分析命令可以接触的资源</text><text x="60" y="123" font-size="40" font-weight="bold">sandbox 与 local-first 的边界</text></g>
<g id="host" data-pptx-bounds="60 181 747 356" fill="#20364B"><rect x="61" y="184" width="737" height="340" fill="#E9F1F5"/><text x="90" y="230" font-size="30" font-weight="bold">宿主机 / 工作区</text><text x="90" y="284">文件工具由 Workspace 限定路径</text><rect x="90" y="325" width="679" height="166" fill="#D9EEEA"/><text x="114" y="371" font-size="30" fill="#007F7A" font-weight="bold">Docker / Podman：只接管 bash</text><text x="114" y="423">默认无网络、代码只读挂载</text><text x="114" y="465" font-size="20">工作区供分析读写，内部状态另有遮蔽与交换路径</text></g>
