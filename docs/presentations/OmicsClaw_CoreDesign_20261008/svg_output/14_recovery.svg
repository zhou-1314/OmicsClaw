<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" width="1280" height="720" fill="#F8FAFC" data-pptx-role="background"/><g id="heading" data-pptx-bounds="60 42 1160 110" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">失败恢复 / 区分可以修正与必须停止的错误</text><text x="60" y="123" font-size="40" font-weight="bold">失败之后，谁负责恢复？</text></g>
<g id="tool" data-pptx-bounds="60 184 1160 121" fill="#20364B"><rect x="60" y="188" width="8" height="106" fill="#007F7A"/><text x="87" y="226" font-size="30" font-weight="bold">工具参数或输入错了</text><text x="87" y="274">is_error 观察回到模型 → 重新读取、修正参数，再决定是否调用</text></g>
<g id="provider" data-pptx-bounds="60 325 1160 120" fill="#20364B"><rect x="60" y="329" width="8" height="106" fill="#17324D"/><text x="87" y="367" font-size="30" font-weight="bold">模型请求出现暂时故障</text><text x="87" y="415">网络错误、429 / 5xx → 有限预算与退避；其他 4xx 不盲目重试</text></g>
<g id="stop" data-pptx-bounds="60 465 1160 120" fill="#20364B"><rect x="60" y="469" width="8" height="106" fill="#AE641B"/><text x="87" y="507" font-size="30" font-weight="bold">总 deadline 已耗尽，或用户取消</text><text x="87" y="555">结束请求或传播取消 → 不追加重试，不回滚已完成的工具副作用</text></g>
<g id="difference" data-pptx-bounds="60 610 1160 44" fill="#526779"><text x="60" y="640" font-size="20">可修正的错误成为下一轮输入；取消与预算耗尽让执行及时停止。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="60 674 1160 26" fill="#526779" font-size="14"><text x="60" y="691">OmicsClaw · 核心组件与设计思想</text><text x="1174" y="691">14</text></g></svg>