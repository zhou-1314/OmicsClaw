<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" width="1280" height="720" fill="#F8FAFC" data-pptx-role="background"/><g id="heading" data-pptx-bounds="60 42 1160 110" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">教程 10 / 工作规范不应散落在模型调用代码里</text><text x="60" y="123" font-size="40" font-weight="bold">PromptAssembler：把规则按职责组装</text></g>
<g id="sections" data-pptx-bounds="60 182 560 347" fill="#20364B"><rect x="60" y="189" width="553" height="328" fill="#E9F1F5"/><text x="84" y="237" font-size="30" font-weight="bold">有序的 Section</text><text x="84" y="294">运行契约 OMICSCLAW.md<tspan x="84" dy="43">安全规则、工具与计划指导</tspan><tspan x="84" dy="43">沙箱说明、技能目录、环境</tspan><tspan x="84" dy="43">长期记忆摘要</tspan></text><text x="84" y="490" font-size="20" fill="#526779">entry 决定顺序，source 按需要读取内容</text></g>
<g id="render" data-pptx-bounds="669 182 551 347" fill="#20364B"><text x="669" y="237" font-size="30" font-weight="bold">render → 一个 system 消息</text><text x="669" y="302">空段落跳过，保留加入顺序<tspan x="669" dy="43">统计每段的 token 估计</tspan><tspan x="669" dy="43">和历史、当前请求一起发给模型</tspan></text><text x="669" y="454" font-size="20" fill="#526779">教程使用 AGENTS.md 演示工作区规范；<tspan x="669" dy="31">本项目分析 Agent 的契约是 OMICSCLAW.md。</tspan></text></g>
<g id="cache" data-pptx-bounds="60 568 1160 83" fill="#17324D"><text x="60" y="604">取舍：可检查、可重组；动态块变化也会影响提示前缀缓存。</text><text x="60" y="639" font-size="20" fill="#526779">稳定工具顺序有助于复用前缀，但不能保证整个 system prompt 的缓存始终命中。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="60 674 1160 26" fill="#526779" font-size="14"><text x="60" y="691">参考：教程 10；源码：context/prompt.py、sections.py；entry/assembly.py::default_sections</text><text x="1174" y="691">14</text></g></svg>
