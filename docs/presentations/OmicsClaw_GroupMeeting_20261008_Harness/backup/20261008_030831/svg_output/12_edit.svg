<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" width="1280" height="720" fill="#F8FAFC" data-pptx-role="background"/><g id="heading" data-pptx-bounds="60 42 1160 110" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">教程 07 / 只改 QC 阈值，为何不重写整个脚本</text><text x="60" y="123" font-size="40" font-weight="bold">edit_file：容错要以唯一匹配为底线</text></g>
<g id="cascade" data-pptx-bounds="60 181 1160 171" fill="#20364B"><text x="60" y="218">path + source_text + target_text</text><rect x="60" y="247" width="242" height="90" fill="#17324D"/><text x="82" y="299" fill="#FFFFFF">L1 精确匹配</text><text x="320" y="299">→</text><rect x="359" y="247" width="245" height="90" fill="#E9F1F5"/><text x="380" y="299">L2 忽略换行差异</text><text x="621" y="299">→</text><rect x="660" y="247" width="248" height="90" fill="#E9F1F5"/><text x="681" y="299">L3 忽略首尾空白</text><text x="925" y="299">→</text><rect x="964" y="247" width="256" height="90" fill="#D9EEEA"/><text x="985" y="299">L4 忽略缩进</text></g>
<g id="ambiguity" data-pptx-bounds="60 391 551 165" fill="#20364B"><text x="60" y="433" font-size="30" font-weight="bold">每一级都必须只匹配一处</text><text x="60" y="481">多处命中 → 拒绝并要求更多上下文<tspan x="60" dy="40">空锚点、纯空白锚点 → 拒绝</tspan></text></g>
<g id="race" data-pptx-bounds="665 391 555 165" fill="#20364B"><text x="665" y="433" font-size="30" font-weight="bold">审批与写入之间再次核对</text><text x="665" y="481">先读文件、匹配并展示 diff<tspan x="665" dy="40">批准后在写锁内复读，变了就拒绝</tspan></text></g>
<g id="check" data-pptx-bounds="60 582 1160 78" fill="#AE641B"><text x="60" y="619">fuzzy 命中后重新读取：Python 缩进变化可能改变语义。</text><text x="60" y="647" font-size="20">容错减少无效重试；唯一性与复读检查防止改错位置、覆盖并发修改。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="60 674 1160 26" fill="#526779" font-size="14"><text x="60" y="691">参考：教程 07；源码：omicsclaw/tools/builtin/edit.py；tests/tools/</text><text x="1174" y="691">12</text></g></svg>
