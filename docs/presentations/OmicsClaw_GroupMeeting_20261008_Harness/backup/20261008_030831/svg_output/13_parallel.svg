<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" width="1280" height="720" fill="#F8FAFC" data-pptx-role="background"/><g id="heading" data-pptx-bounds="60 42 1160 110" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">教程 08 / 同轮多调用不等于已经证明互不依赖</text><text x="60" y="123" font-size="40" font-weight="bold">并发调用需要声明安全边界</text></g>
<g id="schedule" data-pptx-bounds="60 181 1160 279" fill="#20364B"><text x="60" y="220" font-size="20">OmicsClaw 的调度示意：时间向右，块宽不代表耗时</text><rect x="60" y="247" width="333" height="77" fill="#D9EEEA"/><text x="83" y="295">读取样本表 A</text><rect x="60" y="340" width="333" height="77" fill="#D9EEEA"/><text x="83" y="388">读取元数据 B</text><text x="418" y="337">→</text><rect x="480" y="247" width="333" height="170" fill="#17324D"/><text x="504" y="307" fill="#FFFFFF" font-size="30">独占写步骤</text><text x="504" y="360" fill="#FFFFFF" font-size="20">等前批结束，再执行</text><text x="842" y="337">→</text><rect x="901" y="247" width="319" height="170" fill="#E9F1F5"/><text x="925" y="307" font-size="30">后续安全批次</text><text x="925" y="360" font-size="20">结果按调用顺序回填</text></g>
<g id="tradeoff" data-pptx-bounds="60 496 1160 155" fill="#20364B"><text x="60" y="536">教程演示 Fork-Join；项目通过 concurrency_safe 声明控制并发。</text><text x="60" y="581" font-size="20">未声明安全的调用独占；engine 支持并发数配置，registry 提供策略，审批等待暂停工具计时。</text><text x="60" y="626" font-size="20" fill="#AE641B">创建脚本后再运行仍有先后关系；模型的并行请求不能替代依赖与副作用分析。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="60 674 1160 26" fill="#526779" font-size="14"><text x="60" y="691">参考：教程 08；源码：engine/executor.py::_concurrency_groups；tools/registry.py；tools/base.py</text><text x="1174" y="691">13</text></g></svg>
