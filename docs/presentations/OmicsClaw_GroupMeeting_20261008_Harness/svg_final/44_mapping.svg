<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" width="1280" height="720" fill="#F8FAFC" data-pptx-role="background" /><g id="heading" data-pptx-bounds="60 42 1160 110" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">备份 D / Tony Bai《从0开始构建 Agent Harness》</text><text x="60" y="123" font-size="40" font-weight="bold">教程二十讲与 OmicsClaw 对应关系</text></g>
<g id="first" data-pptx-bounds="60 182 554 208" fill="#20364B"><text x="60" y="218" font-size="30" font-weight="bold">01–05：先搭建可替换的循环</text><text font-size="20" x="60" y="259">01 架构分层 → entry 与单向组件边界</text><text font-size="20" x="60" y="287">02 主循环 → schema + engine</text><text font-size="20" x="60" y="315">03 Thinking → 区分原生推理与额外阶段</text><text font-size="20" x="60" y="343">04 模型适配 → provider</text><text font-size="20" x="60" y="371">05 工具注册 → ToolRegistry</text></g>
<g id="second" data-pptx-bounds="665 182 555 208" fill="#20364B"><text x="665" y="218" font-size="30" font-weight="bold">06–10：与环境交互</text><text font-size="20" x="665" y="259">06 基础工具 → read / write / edit / bash</text><text font-size="20" x="665" y="287">07 模糊编辑 → 唯一匹配与复读保护</text><text font-size="20" x="665" y="315">08 并发调用 → 安全批次与独占边界</text><text font-size="20" x="665" y="343">09 飞书与输出 → 三入口 + EngineEvent</text><text font-size="20" x="665" y="371">10 提示与技能 → PromptAssembler + use_skill</text></g>
<g id="third" data-pptx-bounds="60 417 554 208" fill="#20364B"><text x="60" y="453" font-size="30" font-weight="bold">11–15：管理上下文与目标</text><text font-size="20" x="60" y="494">11 会话 → SessionRegistry + SQLite</text><text font-size="20" x="60" y="522">12 压缩 → token 预算与渐进降级</text><text font-size="20" x="60" y="550">13 记忆与待办 → memory + PlanBook</text><text font-size="20" x="60" y="578">14 恢复 → 工具观察与分层重试</text><text font-size="20" x="60" y="606">15 提醒 → PlanInjector 的当次注入</text></g>
<g id="fourth" data-pptx-bounds="665 417 555 208" fill="#20364B"><text x="665" y="453" font-size="30" font-weight="bold">16–20：约束与验证执行</text><text font-size="20" x="665" y="494">16 审批 → PermissionGate + entry 审批通道</text><text font-size="20" x="665" y="522">17 委派 → task + 独立子上下文</text><text font-size="20" x="665" y="550">18 成本 → Usage 与六类运行度量</text><text font-size="20" x="665" y="578">19 追踪 → interaction / turn / llm / tool</text><text font-size="20" x="665" y="606">20 评估 → scripted case 与真实路由评估</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="60 674 1160 26" fill="#526779" font-size="14"><text x="60" y="691">教程是讲解参考；实现差异见对应页面与 sources/tutorial_alignment.md；原始文件路径见 tutorial_manifest.json</text><text x="1174" y="691">44</text></g></svg>