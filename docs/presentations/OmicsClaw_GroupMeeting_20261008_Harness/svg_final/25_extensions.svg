<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F8FAFC" /><g id="heading" data-pptx-bounds="60 42 1160 110" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">教程 17 / 独立子上下文如何回传结果</text><text x="60" y="123" font-size="40" font-weight="bold">MCP 与 subagent 扩展两类能力</text></g>
<g id="mcp" data-pptx-bounds="60 184 545 358" fill="#20364B"><rect x="60" y="187" width="545" height="76" fill="#E9F1F5" /><text x="83" y="236" font-size="30" font-weight="bold">MCP：接入外部工具</text><text x="61" y="322">.mcp.json 声明服务</text><text x="61" y="366">stdio 或 Streamable HTTP</text><text x="61" y="410">转换成普通 Tool 注册</text><text fill="#526779" font-size="20" x="61" y="489">engine 无须区分本地与外部工具；</text><text fill="#526779" font-size="20" x="61" y="521">权限与工具定义仍走统一接口。</text></g>
<g id="delegate" data-pptx-bounds="658 184 562 358" fill="#20364B"><rect x="658" y="187" width="562" height="76" fill="#D9EEEA" /><text x="684" y="236" font-size="30" font-weight="bold">subagent：运行有范围的子任务</text><text x="660" y="322">角色提示 + 缩小的工具集</text><text x="660" y="366">独立上下文，复用同一 engine</text><text x="660" y="410">entry 构造子运行并接收回复</text><text fill="#526779" font-size="20" x="660" y="489">用户请求后，module-reviewer 检查材料；</text><text fill="#526779" font-size="20" x="660" y="521">其职责是审查，不替用户接受模块。</text></g>
<g id="limit" data-pptx-bounds="60 573 1160 68" fill="#AE641B"><text x="60" y="614" font-size="30">独立任务上下文能减少干扰，不能自动消除模型的共同盲点。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="60 674 1160 26" fill="#526779" font-size="14"><text x="60" y="691">来源：mcp/manager.py；subagent/task_tool.py；entry/subagent.py</text><text x="1174" y="691">25</text></g></svg>