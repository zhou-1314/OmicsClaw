<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" width="1280" height="720" fill="#F8FAFC" data-pptx-role="background" /><g id="heading" data-pptx-bounds="60 42 1160 110" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">教程 20 / 模型说“完成了”，怎样验证确实完成</text><text x="60" y="123" font-size="40" font-weight="bold">评估要检查动作与副作用</text></g>
<g id="runner" data-pptx-bounds="60 184 1160 124" fill="#FFFFFF"><rect x="60" y="188" width="1160" height="112" fill="#17324D" /><text x="84" y="234" font-size="30">Case → build_app → SessionRegistry → 轨迹与文件差异 → 断言</text><text x="84" y="278" font-size="20">走生产组装路径；临时工作区记录执行前后状态，而不只检查最终回答。</text></g>
<g id="scripted" data-pptx-bounds="60 348 552 205" fill="#20364B"><text x="60" y="388" font-size="30" font-weight="bold">ScriptedProvider：机制是否守约</text><text x="60" y="435">预设工具调用与回复</text><text x="60" y="474">检查 ToolCalled / ToolArgs</text><text x="60" y="513">检查审批、越界写入、调用次数</text></g>
<g id="live" data-pptx-bounds="665 348 555 205" fill="#20364B"><text x="665" y="388" font-size="30" font-weight="bold">真实模型：是否选对技能</text><text x="665" y="435">26 个路由种子，手动启用</text><text x="665" y="474">重复 trial，记录成功率与失败</text><text x="665" y="513">服务故障与路由质量分开报告</text></g>
<g id="biology" data-pptx-bounds="60 581 1160 72" fill="#AE641B"><text x="60" y="614">回归与路由正确，仍需检验生物学结论和统计假设。</text><text x="60" y="647" font-size="20">实用指标：是否完成、是否越界、耗时与 token；没有本次实测，就不画性能提升曲线。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="60 674 1160 26" fill="#526779" font-size="14"><text x="60" y="691">参考：教程 20；源码：omicsclaw/evals/runner.py、assertions.py；tests/evals/live/</text><text x="1174" y="691">27</text></g></svg>