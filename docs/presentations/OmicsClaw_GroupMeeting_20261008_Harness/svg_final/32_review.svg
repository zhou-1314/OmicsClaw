<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" width="1280" height="720" fill="#F8FAFC" data-pptx-role="background" /><g id="heading" data-pptx-bounds="60 42 1160 110" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">项目扩展 / 当前交互契约</text><text x="60" y="123" font-size="40" font-weight="bold">先交付验证结果，审查与接受由用户触发</text></g>
<g id="lifecycle" data-pptx-bounds="60 181 1160 225" fill="#20364B"><rect x="60" y="220" width="285" height="99" fill="#E9F1F5" /><text x="83" y="263" font-size="30">replay + REPORT</text><text x="83" y="300" font-size="20">验证后立即展示结果</text><text x="364" y="277">→</text><rect x="415" y="220" width="369" height="99" fill="#D9EEEA" /><text x="439" y="263" font-size="30">用户请求 review</text><text x="439" y="300" font-size="20">检查材料，报告 findings</text><text x="805" y="277">→</text><rect x="857" y="220" width="363" height="99" fill="#007F7A" /><text x="881" y="263" font-size="30" fill="#FFFFFF">用户明确 accept</text><text x="881" y="300" font-size="20" fill="#FFFFFF">接受并冻结模块</text><line x1="200" y1="348" x2="456" y2="348" stroke="#007F7A" stroke-width="2" stroke-dasharray="8,4" /><text x="473" y="355" font-size="20" fill="#007F7A">用户明确跳过审查</text><line x1="658" y1="348" x2="1027" y2="348" stroke="#007F7A" stroke-width="2" stroke-dasharray="8,4" /><text x="1038" y="357" fill="#007F7A">→</text><text x="60" y="376" font-size="20" fill="#526779">独立审查默认关闭；Desktop 按钮只为新开启的那一轮授权，下一普通轮恢复关闭。</text></g>
<g id="binding" data-pptx-bounds="60 443 553 175" fill="#20364B"><text x="60" y="483" font-size="30" font-weight="bold">审查绑定具体材料</text><text x="60" y="529">原文 + receipt 绑定 replay 与哈希</text><text x="60" y="568">材料改动后，旧审查不再适用</text><text x="60" y="602" font-size="20" fill="#AE641B">请求审查不授权自动修复、重跑或接受。</text></g>
<g id="acceptance" data-pptx-bounds="665 443 555 175" fill="#20364B"><text x="665" y="483" font-size="30" font-weight="bold">用户决定是否接受</text><text x="665" y="529">未审查结果不能称已批准</text><text x="665" y="568">改已接受模块先 revise，保留 baseline</text><text x="665" y="602" font-size="20" fill="#AE641B">跳过审查接受须用户明确授权 --skip-review。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="60 674 1160 26" fill="#526779" font-size="14"><text x="60" y="691">来源：OMICSCLAW.md；entry/review.py；entry/desktop/；receipt 是校验记录，不是签名</text><text x="1174" y="691">32</text></g></svg>