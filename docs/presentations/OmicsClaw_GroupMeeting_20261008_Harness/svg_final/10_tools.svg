<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" width="1280" height="720" fill="#F8FAFC" data-pptx-role="background" /><g id="heading" data-pptx-bounds="60 42 1160 110" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">教程 05 / 新增工具时，为什么不用修改主循环</text><text x="60" y="123" font-size="40" font-weight="bold">ToolRegistry：注册、描述、执行集中在一处</text></g>
<g id="path" data-pptx-bounds="60 184 1160 301" fill="#20364B"><rect x="60" y="208" width="317" height="212" fill="#E9F1F5" /><text x="83" y="255" font-size="30" font-weight="bold">1 注册实现</text><text x="83" y="305">register(tool)</text><text font-size="20" x="83" y="365">一个对象同时持有</text><text font-size="20" x="83" y="395">定义、策略和执行方法</text><text x="396" y="315" font-size="30">→</text><rect x="457" y="208" width="341" height="212" fill="#17324D" /><text x="480" y="255" font-size="30" fill="#FFFFFF" font-weight="bold">2 暴露定义</text><text x="480" y="305" font-size="20" fill="#FFFFFF">available_tools()</text><text fill="#FFFFFF" font-size="20" x="480" y="365">名称、描述、参数 Schema</text><text fill="#FFFFFF" font-size="20" x="480" y="395">交给 provider，再传给模型</text><text x="818" y="315" font-size="30">→</text><rect x="879" y="208" width="341" height="212" fill="#D9EEEA" /><text x="902" y="255" font-size="30" font-weight="bold">3 路由执行</text><text x="902" y="305">execute(call)</text><text font-size="20" x="902" y="365">按名称找到实现</text><text font-size="20" x="902" y="395">返回 ToolResult</text><text x="60" y="469" font-size="20" fill="#526779">模型选择工具，registry 查找实现，engine 接收观察；主循环不认识具体科学方法。</text></g>
<g id="boundary" data-pptx-bounds="60 523 1160 132" fill="#20364B"><text x="60" y="565" font-size="30">模型可见的定义，与本机执行策略分开。</text><text x="60" y="609" font-size="20">风险、审批和并发声明保留在工具层；部署决定哪些工具可见。</text><text x="60" y="641" font-size="20" fill="#526779">定义按注册顺序稳定输出；通过 Protocol 形状接入 engine，避免反向导入。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="60 674 1160 26" fill="#526779" font-size="14"><text x="60" y="691">参考：教程 05；源码：omicsclaw/tools/registry.py、base.py；engine/executor.py</text><text x="1174" y="691">10</text></g></svg>