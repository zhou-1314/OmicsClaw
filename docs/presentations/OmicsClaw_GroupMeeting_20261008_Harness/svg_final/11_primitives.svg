<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" width="1280" height="720" fill="#F8FAFC" data-pptx-role="background"/><g id="heading" data-pptx-bounds="60 42 1160 110" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">教程 06 / 每种组学方法都要注册成一个工具吗</text><text x="60" y="123" font-size="40" font-weight="bold">四个基础工具怎样执行八十八种方法</text></g>
<g id="primitives" data-pptx-bounds="60 183 1160 193" fill="#20364B"><rect x="60" y="190" width="1160" height="176" fill="#E9F1F5"/><text x="84" y="239" font-size="30" font-weight="bold">read_file</text><text x="84" y="295">读取说明与结果</text><text x="385" y="239" font-size="30" font-weight="bold">write_file</text><text x="385" y="295">写入新步骤</text><text x="681" y="239" font-size="30" font-weight="bold">edit_file</text><text x="681" y="295">局部修改参数</text><text x="981" y="239" font-size="30" font-weight="bold">bash</text><text x="981" y="295">执行分析</text><text x="84" y="341" font-size="20" fill="#526779">基础原语之外，仍有 use_skill、计划、记忆、web、MCP 等按职责提供的工具。</text></g>
<g id="science" data-pptx-bounds="60 409 1160 127" fill="#17324D"><text x="60" y="448" font-size="30">use_skill → 方法说明 → 写分析 step → bash 运行</text><text x="60" y="496" font-size="20">step 内通过 load_skill 组合函数库；CLI-only 方法通过 run_cli 调用。</text><text x="60" y="529" font-size="20" fill="#526779">增加科学方法主要增加技能文档与实现，不要求在 engine 中增加算法分支。</text></g>
<g id="limits" data-pptx-bounds="60 569 1160 82" fill="#AE641B"><text x="60" y="603">减少工具描述负担，同时保留权限和执行环境边界。</text><text x="60" y="639" font-size="20">教程的 YOLO 讨论不能直接等同于本项目默认免审批；bash 仍受部署策略控制。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="60 674 1160 26" fill="#526779" font-size="14"><text x="60" y="691">参考：教程 06；源码：tools/builtin/；skills/tool.py；OMICSCLAW.md</text><text x="1174" y="691">11</text></g></svg>
