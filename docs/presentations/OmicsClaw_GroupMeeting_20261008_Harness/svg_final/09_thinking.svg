<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="26" data-pptx-page-role="content"><rect id="bg" width="1280" height="720" fill="#F8FAFC" data-pptx-role="background" /><g id="heading" data-pptx-bounds="60 42 1160 110" fill="#17324D"><text x="60" y="66" font-size="20" fill="#007F7A">教程 03、04 / 方法选择前是否需要额外一次思考</text><text x="60" y="123" font-size="40" font-weight="bold">Thinking：模型能力与额外阶段要分开</text></g>
<g id="tutorial" data-pptx-bounds="60 183 553 340" fill="#20364B"><text x="60" y="222" font-size="30" font-weight="bold">教程的双阶段方案</text><rect x="60" y="249" width="553" height="88" fill="#E9F1F5" /><text x="84" y="285">请求 1：不给工具，只作规划</text><text x="84" y="320" font-size="20">保留规划文本，作为后续输入</text><line x1="332" y1="338" x2="332" y2="374" stroke="#17324D" stroke-width="3" /><rect x="60" y="375" width="553" height="88" fill="#E9F1F5" /><text x="84" y="411">请求 2：提供工具，采取行动</text><text x="84" y="446" font-size="20">额外调用增加延迟与上下文消耗</text><text x="60" y="508" font-size="20" fill="#526779">它是可比较的设计方案，收益需要实验。</text></g>
<g id="current" data-pptx-bounds="665 183 555 340" fill="#20364B"><text x="665" y="222" font-size="30" font-weight="bold">OmicsClaw 当前实现</text><rect x="665" y="249" width="555" height="214" fill="#D9EEEA" /><text x="689" y="293">单个 ReAct 轮次调用 provider</text><text x="689" y="336">原生推理由模型与适配器处理</text><text x="689" y="379">工具调用继续进入同一循环</text><text x="689" y="437" font-size="20">保留 reasoning_content 等协议字段</text><text x="665" y="508" font-size="20" fill="#526779">engine 没有强制的“先无工具、后有工具”阶段。</text></g>
<g id="choice" data-pptx-bounds="60 559 1160 93" fill="#17324D"><text x="60" y="595" font-size="30">取舍：把额外思考变成可评估的策略，而非默认翻倍调用。</text><text x="60" y="636" font-size="20" fill="#526779">组学例子：复杂批次设计可能需要规划；读取一个 QC 表不一定需要第二次模型请求。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="60 674 1160 26" fill="#526779" font-size="14"><text x="60" y="691">参考：教程 03、04；源码：engine/loop.py::_kernel；provider/；schema/</text><text x="1174" y="691">09</text></g></svg>