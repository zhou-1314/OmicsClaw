name: npm release

# Builds the four `@omicsclaw/runtime-<target>` platform packages and, on
# request, publishes them plus the `omicsclaw` wrapper to npm.
#
# See npm/AGENTS.md for the distribution model. The short version: the wrapper
# carries no runtime and lists one platform package per host in
# `optionalDependencies`; npm's `os` / `cpu` filtering means each machine
# downloads exactly one.
#
# The runtime content is defined by `scripts/build-backend-runtime.py`, which
# lives in THIS repository. It used to be checked out of the private
# OmicsClaw-App repo over a PAT; that repo dropped its embedded Python
# distribution in OmicsClaw-App@faf1e16 and deleted the script, which forced
# the move this workflow's header had already recommended. The script builds a
# Python environment defined by *this* project's dependencies, so this is also
# where it belongs.
#
# ## Publishing
#
# Publish is opt-in (`publish: true` on manual dispatch) and gated on the
# `npm-publish` environment so it can require a reviewer. Runtime packages go
# first: the wrapper's `optionalDependencies` point at exact versions, and an
# optional dependency that cannot resolve fails SILENTLY — publishing the
# wrapper first would leave a window where `npm i -g omicsclaw` installs
# something that cannot run.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm after all four runtimes build"
        required: false
        default: false
        type: boolean
      confirm:
        description: "To publish, type the exact version being released (e.g. 0.1.2)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-runtime:
    name: runtime ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      # Every cell runs to completion so one broken target does not hide the
      # state of the other three.
      fail-fast: false
      matrix:
        include:
          # Four targets, not six. `darwin-x64` is absent because llvmlite 0.47
          # no longer publishes macOS x86_64 wheels and the source build needs a
          # pinned LLVM toolchain; `win32-arm64` is absent because there is no
          # native hosted runner and Windows has no Rosetta equivalent. Adding
          # a target means touching all five places listed in npm/AGENTS.md.
          - target: linux-x64
            py-platform: linux
            py-arch: x64
            runs-on: ubuntu-latest
          - target: linux-arm64
            py-platform: linux
            py-arch: arm64
            runs-on: ubuntu-24.04-arm
          - target: darwin-arm64
            py-platform: macos
            py-arch: arm64
            runs-on: macos-latest
          - target: win32-x64
            py-platform: windows
            py-arch: x64
            runs-on: windows-latest

    steps:
      - name: Check out OmicsClaw
        uses: actions/checkout@v6

      # The builder is stdlib-only, so any modern Python can run it. The
      # interpreter it *produces* is a pinned python-build-standalone download
      # and is unaffected by this version.
      - name: Set up host Python for the builder
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node for the packager
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # The builder's phase-2 smoke test boots the desktop server, which takes
      # an exclusive lock on the control database under the state dir. Pointing
      # that at a scratch path keeps the probe from colliding with anything else
      # on the machine — which is exactly how this fails on a developer box, and
      # would fail on a self-hosted runner.
      - name: Build the Python runtime
        shell: bash
        env:
          XDG_STATE_HOME: ${{ runner.temp }}/omicsclaw-state
        run: |
          set -euo pipefail
          mkdir -p "$XDG_STATE_HOME"
          # Deliberately NOT piped: a pipeline reports the LAST command's exit
          # code, so `... | tail` would mask a failed smoke test and let a
          # broken runtime through.
          python scripts/build-backend-runtime.py \
            --platform "${{ matrix.py-platform }}" \
            --arch "${{ matrix.py-arch }}" \
            --omicsclaw-local "$GITHUB_WORKSPACE" \
            --project-root "${{ runner.temp }}/rt"

      - name: Assemble the npm platform package
        shell: bash
        run: |
          set -euo pipefail
          node npm/build-runtime-package.mjs \
            --target "${{ matrix.target }}" \
            --runtime-dir "${{ runner.temp }}/rt/backend-runtime" \
            --out "${{ runner.temp }}/npmdist"

      # Pack here rather than in the publish job so the artifact IS the tarball
      # that gets published — no repack, nothing that could differ from what was
      # smoke-tested. This also matters because `npm pack` strips symlinks (see
      # npm/AGENTS.md); packing once means one well-understood transformation.
      - name: Pack the platform package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/tgz"
          cd "${{ runner.temp }}/npmdist/@omicsclaw/runtime-${{ matrix.target }}"
          npm pack --pack-destination "${{ runner.temp }}/tgz"

      - name: Verify the packed runtime still resolves
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ runner.temp }}/npmdist/@omicsclaw/runtime-${{ matrix.target }}"
          node -e '
            const m = require("./package.json");
            const rel = m.omicsclawRuntime?.pythonRelPath;
            if (!rel) { console.error("manifest lost omicsclawRuntime.pythonRelPath"); process.exit(1); }
            const fs = require("fs");
            const p = require("path").join("runtime", ...rel.split("/"));
            if (!fs.existsSync(p)) { console.error("recorded interpreter missing: " + p); process.exit(1); }
            console.log(`${m.name}@${m.version} os=${m.os} cpu=${m.cpu} interpreter=${rel}`);
          '

      - name: Report size
        shell: bash
        run: |
          ls -la "${{ runner.temp }}/tgz"

      - uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.target }}
          path: ${{ runner.temp }}/tgz/*.tgz
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: build-runtime
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    # Reviewer gate plus a home for the NPM_TOKEN secret. Configure required
    # reviewers on this environment so a dispatch cannot publish unattended.
    environment: npm-publish
    permissions:
      contents: read
      # Required for `npm publish --provenance`, which attests the build back to
      # this workflow run. Only works from a public repository — this one is.
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # A solo repository cannot have a working required-reviewer gate: the
      # environment's only reviewer is also the only person who can dispatch,
      # and GitHub auto-approves that (prevent_self_review would deadlock
      # instead). So the human checkpoint is here — the dispatcher must type
      # the version, which no accidental re-run can supply.
      - name: Require the release version to be typed out
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./npm/omicsclaw/package.json').version")
          if [ "${{ inputs.confirm }}" != "$version" ]; then
            echo "::error::publish requires confirm='$version' (got '${{ inputs.confirm }}'). Nothing was published."
            exit 1
          fi
          echo "Confirmed release of $version"

      - name: Sanity-check the wrapper before anything is published
        shell: bash
        run: |
          set -euo pipefail
          # Pass files, not the directory. Node 22 stopped expanding a bare
          # directory into the test files under it and tried to execute the
          # directory as the entry module (MODULE_NOT_FOUND). The shell glob
          # works on every version and does not depend on that behaviour.
          node --test npm/omicsclaw/test/*.test.mjs

      - uses: actions/download-artifact@v6
        with:
          pattern: runtime-*
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true

      # The wrapper pins its optionalDependencies to an EXACT version. A
      # mismatch would publish a wrapper that can never resolve a runtime, and
      # because optional-dependency failures are silent the breakage would only
      # surface as "the command does nothing".
      - name: Verify every runtime matches the wrapper version and is complete
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');

          const wrapper = JSON.parse(
            fs.readFileSync('npm/omicsclaw/package.json', 'utf-8'),
          );
          const expected = Object.keys(wrapper.optionalDependencies).sort();
          const dir = process.env.RUNNER_TEMP + '/artifacts';
          const tarballs = fs.readdirSync(dir).filter((f) => f.endsWith('.tgz'));

          const found = new Map();
          for (const file of tarballs) {
            const raw = execFileSync('tar', ['-xzOf', path.join(dir, file), 'package/package.json'], {
              encoding: 'utf-8',
            });
            const m = JSON.parse(raw);
            found.set(m.name, { version: m.version, file });
          }

          const problems = [];
          for (const name of expected) {
            const hit = found.get(name);
            if (!hit) { problems.push(`missing runtime package: ${name}`); continue; }
            const pinned = wrapper.optionalDependencies[name];
            if (hit.version !== pinned) {
              problems.push(`${name} is ${hit.version} but the wrapper pins ${pinned}`);
            }
          }
          for (const name of found.keys()) {
            if (!expected.includes(name)) problems.push(`unexpected extra package: ${name}`);
          }

          if (problems.length > 0) {
            for (const p of problems) console.error('::error::' + p);
            process.exit(1);
          }
          console.log(`wrapper ${wrapper.name}@${wrapper.version}`);
          for (const name of expected) console.log(`  ok ${name}@${found.get(name).version}`);
          JS

      # Runtimes BEFORE the wrapper — see the header. Publishing the wrapper
      # first opens a window where it installs but cannot run.
      - name: Publish the platform packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for tgz in "${{ runner.temp }}"/artifacts/*.tgz; do
            echo "==> $tgz"
            npm publish "$tgz" --provenance --access public
          done

      - name: Publish the wrapper
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd npm/omicsclaw
          npm publish --provenance --access public

      - name: Summary
        shell: bash
        run: |
          v=$(node -p "require('./npm/omicsclaw/package.json').version")
          {
            echo "### Published omicsclaw@$v"
            echo
            echo '```sh'
            echo "npm install -g omicsclaw@$v"
            echo '```'
            echo
            echo "Hosts without a prebuilt runtime (darwin-x64, win32-arm64) fall back to a source install."
          } >> "$GITHUB_STEP_SUMMARY"
