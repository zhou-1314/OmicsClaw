schema_version: 2
id: bulkrna-enrichment
name: bulkrna-enrichment
domain: bulkrna
version: 0.3.0
author: OmicsClaw
license: MIT
emoji: 🛤️
summary:
  load_when: running pathway / GO term enrichment on a bulk RNA-seq DE result list
  skip_when:
  - condition: the input is single-cell
    use: sc-enrichment
  - condition: the input is spatial
    use: spatial-enrichment
  - condition: metabolite pathways
    use: metabolomics-pathway-enrichment
  trigger_keywords:
  - bulk enrichment
  - pathway analysis
  - GSEA
  - ORA
  - GO enrichment
  - KEGG
  - bulk pathway
  tags:
  - bulkrna
  - enrichment
  - GSEA
  - ORA
  - GO
  - KEGG
  - Reactome
  - pathway
  aliases:
  - bulk-enrichment
interface:
  inputs:
    file_types:
    - csv
    artifacts:
    - kind: bulkrna.differential_results
      formats:
      - csv
  outputs:
    files:
    - tables/enrichment_results.csv
    - tables/enrichment_significant.csv
    - figures/enrichment_barplot.png
    - figures/enrichment_dotplot.png
    - report.md
    - result.json
runtime:
  entry: bulkrna_enrichment.py
deps:
  python:
  - gseapy
  - matplotlib
  - numpy
  - pandas
  - scipy
resources:
  references:
  - methodology.md
  - output_contract.md
  - parameters.md
  tests: tests/
validation:
  protocols:
  - id: biomnibench-da12-2-deterministic-preflight-v1
    kind: fixture
    entry: tests/biomnibench_da12_2.py
    runner: command
    suite_id: biomnibench-da
    case_ids:
    - da-12-2
    dataset_ref:
      store: repository
      path: data/benchmarks/biomnibench-da/da-12-2
      content_sha256: sha256:00c42c92536a615b7127e69c4691299e890a23264e503255cd5ba4081248e3e9
    pass_rule: all_runs
    repeats: 1
    timeout_seconds: 600
    metrics:
    - checks_passed
    - checks_total
    - query_genes
    - pathways_tested
    - background_genes
    - query_genes_in_background
    - significant_pathways
    - g2m_overlap_genes
    - g2m_pathway_size
    - g2m_pvalue
    - g2m_fdr
    - g2m_rank
